<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1014">
<title>Organizador de Torneos</title>
<style>
:root{
  --bg:#0e1014;--bg2:#12151b;--card:#181c23;--card2:#1f242d;--bd:#2a303b;--bd2:#3a4250;
  --tx:#e8eaf0;--mut:#8f98ab;--acc:#ff7324;--acc2:#ff9a5a;--accbg:rgba(255,115,36,.13);
  --win:#22c55e;--winbg:rgba(34,197,94,.13);--warn:#f5b301;--warnbg:rgba(245,179,1,.12);
  --danger:#ef4444;--line:#3d4554;--gap:44px;--r:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,Arial,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
i{font-style:normal;color:var(--mut)}
.muted{color:var(--mut)}.small{font-size:12.5px}
.hidden{display:none!important}

/* Top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(14,16,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),#ff3d6e);font-size:20px;flex:none}
.brand-title{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.brand-sub{font-size:12.5px;color:var(--mut)}
.top-right{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;border:1px solid}
.pill.org{color:var(--win);border-color:rgba(34,197,94,.4);background:var(--winbg)}
.pill.spec{color:var(--warn);border-color:rgba(245,179,1,.4);background:var(--warnbg)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}

main{max-width:1400px;margin:0 auto;padding:20px}
.banner{max-width:1400px;margin:14px auto 0;padding:0 20px}
.banner .inner{background:var(--warnbg);border:1px solid rgba(245,179,1,.35);color:#f8d77a;border-radius:var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font-size:14px}

/* Generic */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px}
.card h2{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:10px}
.card h3{margin:0;font-size:15px}
.step{width:26px;height:26px;border-radius:50%;background:var(--accbg);color:var(--acc);display:grid;place-items:center;font-size:13px;font-weight:700}
.badge{background:var(--card2);border:1px solid var(--bd);border-radius:999px;padding:1px 9px;font-size:12.5px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--bd2);background:var(--card2);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--tx);transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{border-color:var(--acc);background:#262c37}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#1a0d04}
.btn.primary:hover{background:var(--acc2)}
.btn.ghost{background:transparent}
.btn.danger{color:#fca5a5;border-color:rgba(239,68,68,.4)}
.btn.danger:hover{background:rgba(239,68,68,.12);border-color:var(--danger)}
.btn.big{padding:14px 20px;font-size:16px;width:100%;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.inp{width:100%;background:var(--bg2);border:1px solid var(--bd);border-radius:9px;padding:9px 12px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--acc)}
.inp.sm{padding:5px 9px}
textarea.inp{resize:vertical;min-height:110px}
select.inp{cursor:pointer}
.lbl{display:block;font-size:13px;color:var(--mut);margin:0 0 6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.notice{margin-top:12px;padding:10px 12px;border-radius:9px;background:var(--card2);border:1px solid var(--bd);font-size:13.5px;color:#c8cede}
.notice.ok{border-color:rgba(34,197,94,.35);background:var(--winbg);color:#a7f3c1}
.notice.warn{border-color:rgba(245,179,1,.35);background:var(--warnbg);color:#f8d77a}

/* Setup */
.setup-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.setup-grid .col{display:flex;flex-direction:column;gap:18px;min-width:0}
.add-one{display:flex;gap:8px}
.plist{list-style:none;margin:14px 0 0;padding:0;max-height:380px;overflow:auto;border:1px solid var(--bd);border-radius:10px}
.plist:empty{display:none}
.pitem{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;border-bottom:1px solid var(--bd)}
.pitem:last-child{border-bottom:0}
.pitem:hover{background:var(--card2)}
.pn{width:24px;color:var(--mut);font-size:12.5px;text-align:right;flex:none}
.pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--mut);flex:none}
.icon-btn:hover{background:var(--bg2);border-color:var(--bd2);color:var(--tx)}
.icon-btn.del:hover{color:#fca5a5;border-color:rgba(239,68,68,.5)}
.icon-btn.ok{color:var(--win)}
.fmt-grid{display:grid;gap:10px}
.opt-card{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--bd);background:var(--bg2);cursor:pointer;transition:border-color .15s,background .15s}
.opt-card:hover{border-color:var(--bd2);background:var(--card2)}
.opt-card.sel{border-color:var(--acc);background:var(--accbg)}
.opt-card .ic{font-size:22px;line-height:1;flex:none;margin-top:2px}
.opt-card b{display:block;font-size:14.5px}
.opt-card span{font-size:13px;color:var(--mut)}
.opt-card .radio{margin-left:auto;width:18px;height:18px;border-radius:50%;border:2px solid var(--bd2);flex:none;margin-top:2px}
.opt-card.sel .radio{border-color:var(--acc);box-shadow:inset 0 0 0 4px var(--bg2);background:var(--acc)}
.sub-opts{margin-top:14px;padding-top:14px;border-top:1px dashed var(--bd)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sizes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--bd);font-size:12.5px}
.chip.ll{border-color:rgba(255,115,36,.45);color:var(--acc2)}
.chip.bye{border-color:rgba(245,179,1,.4);color:#f8d77a}

/* Running */
.sec-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}
.sec-head h2{margin:0;font-size:18px}
.hint{font-size:13px;color:var(--mut)}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--bd);overflow-x:auto}
.tab{padding:10px 16px;border:0;background:none;color:var(--mut);cursor:pointer;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.tab:disabled{opacity:.4;cursor:not-allowed}
.champion-banner{display:flex;align-items:center;gap:16px;padding:16px 20px;margin-bottom:18px;border-radius:14px;background:linear-gradient(120deg,rgba(255,115,36,.22),rgba(245,179,1,.12) 60%,rgba(34,197,94,.08));border:1px solid rgba(255,154,90,.45)}
.champion-banner .tro{font-size:40px;filter:drop-shadow(0 4px 12px rgba(255,154,90,.5))}
.champion-banner small{display:block;color:var(--acc2);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.champion-banner b{font-size:24px}

/* Bracket */
.bracket-scroll{overflow-x:auto;overflow-y:hidden;padding:6px 4px 18px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-color:var(--bd2) transparent}
.bracket-scroll::-webkit-scrollbar{height:10px}
.bracket-scroll::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:10px}
.bracket{display:flex;gap:var(--gap);width:max-content;min-width:100%}
.round{display:flex;flex-direction:column;flex:none}
.round-title{text-align:center;margin-bottom:6px;padding:7px 10px;background:var(--card);border:1px solid var(--bd);border-radius:9px}
.round-title b{display:block;font-size:13.5px}
.round-title small{color:var(--mut);font-size:11.5px}
.round-body{flex:1;display:flex;flex-direction:column;justify-content:space-around}
.bracket.free .round-body{justify-content:flex-start}
.mw{flex:1 1 0;display:flex;align-items:center;position:relative;padding:16px 0 8px}
.bracket.free .mw{flex:none}
.lines .round.has-next .mw::after{content:"";position:absolute;right:calc(var(--gap) / -2);width:calc(var(--gap) / 2);border-right:2px solid var(--line)}
.lines .round.has-next .mw:nth-child(odd)::after{top:calc(50% + 4px);height:calc(50% - 4px);border-top:2px solid var(--line);border-top-right-radius:6px}
.lines .round.has-next .mw:nth-child(even)::after{top:0;height:calc(50% + 4px);border-bottom:2px solid var(--line);border-bottom-right-radius:6px}
.lines .round.has-prev .mw::before{content:"";position:absolute;left:calc(var(--gap) / -2);width:calc(var(--gap) / 2);top:calc(50% + 4px);border-top:2px solid var(--line)}
.match{width:236px;background:var(--card);border:1px solid var(--bd);border-radius:9px;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.25);transition:border-color .15s}
.match:hover{border-color:var(--bd2)}
.match.done{border-color:#2f3a35}
.match.byematch{opacity:.55;border-style:dashed}
.mnum{position:absolute;top:-17px;left:2px;font-size:11px;color:var(--mut);font-weight:600}
.team{display:flex;align-items:center;gap:6px;height:38px;padding:0 6px 0 9px;border-left:3px solid transparent;transition:background .12s,border-color .12s;user-select:none}
.team:first-of-type{border-radius:8px 8px 0 0}
.team:last-of-type{border-radius:0 0 8px 8px}
.team+.team{border-top:1px solid var(--bd)}
.tname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.team.clickable{cursor:pointer}
.team.clickable:hover{background:var(--accbg);border-left-color:var(--acc)}
.team.clickable:hover .tname{color:#fff}
.team.win{background:var(--winbg);border-left-color:var(--win)}
.team.win .tname{font-weight:700}
.team.win.clickable:hover{background:rgba(34,197,94,.2);border-left-color:var(--win)}
.team.lose .tname{color:var(--mut)}
.ck{color:var(--win);font-weight:800;margin-right:4px}
.tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:5px;font-size:10.5px;font-weight:700;vertical-align:1px;background:var(--card2);border:1px solid var(--bd2);color:var(--mut)}
.tag.ll{color:var(--acc2);border-color:rgba(255,115,36,.5)}
input.score{width:40px;height:28px;flex:none;text-align:center;background:var(--bg2);border:1px solid var(--bd);border-radius:6px;outline:none;font-weight:700;padding:0}
input.score:focus{border-color:var(--acc)}
span.score{width:30px;flex:none;text-align:center;font-weight:800}
.team.win span.score{color:var(--win)}
.champ-card{width:200px;padding:18px 12px;text-align:center;border-radius:12px;background:linear-gradient(160deg,rgba(255,115,36,.25),rgba(245,179,1,.1));border:1px solid rgba(255,154,90,.55);font-size:30px}
.champ-card span{display:block;font-size:16px;font-weight:800;margin-top:6px}
.round-chips{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-width:236px}
.ll-panel{margin-top:6px}
.ll-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.ll-table th,.ll-table td{padding:8px;border-bottom:1px solid var(--bd);text-align:center}
.ll-table th{color:var(--mut);font-weight:600;font-size:12.5px}
.ll-table .l{text-align:left}
.ll-table tr.pick{background:var(--accbg)}
.ll-table input{width:18px;height:18px;accent-color:var(--acc);cursor:pointer}

/* Groups */
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.group-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.table-wrap{overflow-x:auto;margin:0 -4px}
.standings{width:100%;border-collapse:collapse;font-size:13.5px;min-width:380px}
.standings th{color:var(--mut);font-weight:600;font-size:12px;padding:7px 5px;border-bottom:1px solid var(--bd);text-align:center}
.standings td{padding:7px 5px;text-align:center;border-bottom:1px solid var(--bd)}
.standings .l{text-align:left;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.standings tr.q td:first-child{box-shadow:inset 3px 0 0 var(--win)}
.standings tr.q td.l{color:#b7f5cb;font-weight:600}
.standings .pts{font-weight:800}
.fixtures{margin-top:14px}
.day{font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px;display:flex;justify-content:space-between;gap:8px}
.day span{font-weight:500;text-transform:none;letter-spacing:0}
.gmatch{display:grid;grid-template-columns:1fr auto auto auto 1fr;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;background:var(--bg2);margin-bottom:5px;border:1px solid transparent}
.gmatch.done{border-color:var(--bd)}
.gt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.gt.r{text-align:right}
.gt.w{font-weight:700;color:#b7f5cb}
.gscore{width:28px;text-align:center;font-weight:800}
.sep{color:var(--mut)}
.action-bar{margin-top:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}

/* Ladder */
.ladder-top{display:grid;grid-template-columns:1.2fr 1fr 1.4fr;gap:14px;margin-bottom:18px}
.kcard{border-color:rgba(255,154,90,.5);background:linear-gradient(150deg,rgba(255,115,36,.16),var(--card) 70%)}
.big{font-size:22px;font-weight:800;margin:4px 0;overflow-wrap:anywhere}
.queue{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:110px;overflow:auto}
.current-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px;margin-bottom:20px;border:1px dashed var(--bd2);border-radius:14px}
.current-wrap .match{width:min(420px,100%)}
.current-wrap .team{height:52px}
.current-wrap .tname{font-size:17px}
.ladder-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 14px;margin-top:12px}
.ladder-list .match{width:100%}
.lstep{position:relative;padding-top:4px}

/* Modal + toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.modal-box{width:min(560px,100%);background:var(--card);border:1px solid var(--bd2);border-radius:14px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-box h3{margin:0 0 8px;font-size:17px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);opacity:0;pointer-events:none;z-index:60;background:#252b35;border:1px solid var(--bd2);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:all .25s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty-state{text-align:center;padding:50px 20px;color:var(--mut)}
.empty-state .e{font-size:44px}

@media (max-width:900px){
  .setup-grid{grid-template-columns:minmax(0,1fr)}
  .ladder-top{grid-template-columns:1fr}
}
@media (max-width:600px){
  main{padding:14px}
  .topbar{padding:10px 14px}
  .banner{padding:0 14px}
  :root{--gap:34px}
  .match{width:210px}
  .groups-grid{grid-template-columns:minmax(0,1fr)}
  .two{grid-template-columns:1fr}
  .card{padding:14px}
  .brand-title{max-width:80vw}
  .toolbar .btn{padding:7px 10px;font-size:13px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">🏆</div>
    <div style="min-width:0">
      <div class="brand-title" id="hdrTitle">Organizador de Torneos</div>
      <div class="brand-sub" id="hdrSub">Configura tu torneo</div>
    </div>
  </div>
  <div class="top-right">
    <span id="modePill" class="pill org"></span>
    <div id="toolbar" class="toolbar"></div>
  </div>
</header>
<div id="banner"></div>
<main id="app"></main>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast"></div>

<script>
'use strict';
/* =========================================================
   ORGANIZADOR DE TORNEOS — Vanilla JS, un solo archivo
   ========================================================= */
const STORE_KEY = 'organizador-torneos-v1';
const BYE = '__BYE__';
const FORMAT_LABEL = {
  single: 'Eliminación Directa',
  groups: 'Fase de Grupos + Eliminación Directa',
  ladder: 'Escalera / Rey de la Pista'
};
const SAMPLE = ['Águilas', 'Tigres', 'Leones', 'Halcones', 'Pumas', 'Lobos', 'Toros', 'Cóndores'];

let S = null;            // estado del torneo
let READONLY = false;    // modo espectador
let SNAP_AT = null;      // fecha de la instantánea compartida
let teamMap = {};
const ui = { tab: 'groups', editId: null, llSel: [], focus: null, shareUrl: '' };

/* ---------- Utilidades ---------- */
function defaultState() {
  return { v: 1, name: 'Mi Torneo', phase: 'setup', teams: [], seq: 1, format: 'single',
           oddRule: 'bye', groupCount: null, qualifiers: 2, t: null };
}
function uid(p) { return p + (S.seq++).toString(36); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function rndInt(n) {
  if (window.crypto && crypto.getRandomValues) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
  return Math.floor(Math.random() * n);
}
/* Fisher-Yates */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = rndInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const nextPow2 = n => { let p = 1; while (p < n) p *= 2; return p; };
const isPow2 = n => n > 0 && (n & (n - 1)) === 0;
const teamName = id => id === BYE ? 'BYE' : (teamMap[id] ? teamMap[id].name : '?');
const plural = (n, s, p) => n === 1 ? s : (p || s + 's');
const cssEsc = s => (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\]/g, '\\$&');

function save() {
  if (READONLY) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* sin almacenamiento */ }
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) return Object.assign(defaultState(), o); }
  } catch (e) { }
  return defaultState();
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

/* ---------- Participantes ---------- */
function addTeams(names) {
  const existing = new Set(S.teams.map(t => t.name.toLowerCase()));
  let added = 0, dup = 0;
  names.map(s => s.replace(/^\s*(\d+\s*[.)\-:]\s*|[-•*]\s+)/, '').trim()).filter(Boolean).forEach(n => {
    n = n.slice(0, 40);
    if (existing.has(n.toLowerCase())) { dup++; return; }
    existing.add(n.toLowerCase());
    S.teams.push({ id: uid('t'), name: n }); added++;
  });
  save(); render();
  if (added || dup) toast(`${added} ${plural(added, 'agregado')}` + (dup ? ` · ${dup} ${plural(dup, 'repetido')} omitido${dup === 1 ? '' : 's'}` : ''));
}

/* ---------- Eliminación directa ---------- */
function seedOrder(size) {
  if (size < 2) return [1];
  let o = [1, 2];
  for (let m = 2; m < size; m *= 2) o = o.flatMap(s => [s, 2 * m + 1 - s]);
  return o;
}
/* Evita que dos equipos del mismo grupo se crucen en la primera ronda */
function fixConflicts(pairs, groupOf) {
  for (let i = 0; i < pairs.length; i++) {
    if (groupOf[pairs[i][0]] !== groupOf[pairs[i][1]]) continue;
    for (let j = 0; j < pairs.length; j++) {
      if (j === i) continue;
      if (groupOf[pairs[i][0]] !== groupOf[pairs[j][1]] && groupOf[pairs[j][0]] !== groupOf[pairs[i][1]]) {
        const tmp = pairs[i][1]; pairs[i][1] = pairs[j][1]; pairs[j][1] = tmp; break;
      }
    }
  }
}
const newMatch = (a, b) => ({ id: uid('m'), a, b, sa: null, sb: null, w: null });

/* Llave clásica con BYE: los "seeds" altos (o sorteados) reciben el pase directo */
function buildBracketBye(ids, groupOf) {
  const n = ids.length, size = nextPow2(n), order = seedOrder(size);
  const src = s => s <= n ? { t: 'team', id: ids[s - 1] } : { t: 'bye' };
  const r0 = [];
  for (let i = 0; i < size; i += 2) r0.push(newMatch(src(order[i]), src(order[i + 1])));
  if (groupOf) {
    const full = r0.filter(m => m.a.t === 'team' && m.b.t === 'team');
    const pairs = full.map(m => [m.a.id, m.b.id]);
    fixConflicts(pairs, groupOf);
    full.forEach((m, i) => { m.b.id = pairs[i][1]; });
  }
  const rounds = [{ matches: r0 }];
  let cur = r0;
  while (cur.length > 1) {
    const nx = [];
    for (let j = 0; j < cur.length; j += 2) nx.push(newMatch({ t: 'win', m: cur[j].id }, { t: 'win', m: cur[j + 1].id }));
    rounds.push({ matches: nx }); cur = nx;
  }
  return { mode: 'bye', rounds };
}
/* Ronda dinámica (modo Mejor Perdedor) */
function makeDynamicRound(entrants, ll, groupOf) {
  const list = entrants.slice(), byes = [];
  if (list.length % 2) byes.push(list.shift());
  const pairs = [], L = list.length;
  for (let i = 0; i < L / 2; i++) pairs.push([list[i], list[L - 1 - i]]);
  if (groupOf) fixConflicts(pairs, groupOf);
  return { matches: pairs.map(p => newMatch({ t: 'team', id: p[0] }, { t: 'team', id: p[1] })), byes, ll: ll || [] };
}
function buildElim(ids, rule, groupOf, tags) {
  let e;

  if (isPow2(ids.length)) e = buildBracketBye(ids, groupOf);
  else e = { mode: 'lucky', rule: rule === 'bye' ? 'bye' : 'lucky', rounds: [makeDynamicRound(ids, [], groupOf)] };
  if (tags) e.tags = tags;

}
function buildIndex(elim) {
  const idx = {};

  return idx;
}
function srcTeam(src, idx) {
  if (!src) return undefined;
  if (src.t === 'team') return src.id;
  if (src.t === 'bye') return BYE;
  if (src.t === 'win') return idx[src.m] ? matchWinner(idx[src.m].m, idx) : undefined;
}
function matchWinner(m, idx) {
  const a = srcTeam(m.a, idx), b = srcTeam(m.b, idx);
  if (a === BYE && b === BYE) return BYE;
  if (b === BYE) return a;

/* Limpia resultados que ya no son válidos (al cambiar un ganador anterior) */
function sanitizeElim(elim) {
  let c = 0; const idx = buildIndex(elim);
  for (const r of elim.rounds) for (const m of r.matches) {
    const a = srcTeam(m.a, idx), b = srcTeam(m.b, idx);
    const ready = a && b && a !== BYE && b !== BYE;
    if (!ready) {
      if (m.w) c++;
      m.w = null; m.sa = null; m.sb = null;
    } else if (m.w && m.w !== a && m.w !== b) {

}
function luckyStatus(elim) {
  const idx = buildIndex(elim), last = elim.rounds[elim.rounds.length - 1];
  const winners = [], losers = [];
  for (const m of last.matches) {
    const w = matchWinner(m, idx);
    if (!w) return { complete: false };
    const a = m.a.id, b = m.b.id, loser = w === a ? b : a;
    const has = m.sa != null && m.sb != null;
    const ws = w === a ? m.sa : m.sb, ls = w === a ? m.sb : m.sa;
    winners.push(w);
    losers.push({ id: loser, diff: has ? ls - ws : null, gf: has ? ls : null, beatBy: w });

}
function rankLosers(losers) {
  return losers.slice().sort((x, y) =>
    (x.diff == null) - (y.diff == null) || (y.diff ?? 0) - (x.diff ?? 0) || (y.gf ?? 0) - (x.gf ?? 0) ||
    teamName(x.id).localeCompare(teamName(y.id)));
}
function elimChampion(elim) {

    const idx = buildIndex(elim), fin = elim.rounds[elim.rounds.length - 1].matches[0];
    const w = matchWinner(fin, idx); return w && w !== BYE ? w : null;
  }
  const st = luckyStatus(elim);
  return st.complete && st.survivors.length === 1 ? st.survivors[0] : null;

function roundName(entrants, ri) {
  const names = { 2: 'Final', 4: 'Semifinales', 8: 'Cuartos de final', 16: 'Octavos de final', 32: 'Dieciseisavos' };
  return names[entrants] || 'Ronda ' + (ri + 1);
}

/* ---------- Grupos ---------- */
function groupCfg() {
  const n = S.teams.length;
  const maxG = Math.max(1, Math.floor(n / 2));
  let G = S.groupCount || Math.max(1, Math.round(n / 4));
  G = Math.min(Math.max(1, G), maxG);
  const minSize = Math.floor(n / G);
  let Q = Math.min(Math.max(1, S.qualifiers || 2), Math.max(1, minSize));
  if (G * Q < 2 && minSize >= 2) Q = 2;
  const sizes = []; for (let g = 0; g < G; g++) sizes.push(minSize + (g < n % G ? 1 : 0));
  const total = G * Q;
  let ok = true, msg = '';
  if (n < 3) { ok = false; msg = 'Se necesitan al menos 3 participantes para la fase de grupos.'; }
  else if (total < 2) { ok = false; msg = 'Deben clasificar al menos 2 equipos.'; }
  return { G, Q, sizes, total, ok, msg, maxG, minSize };
}
function roundRobin(list) {
  const arr = list.slice(); if (arr.length % 2) arr.push(null);
  const n = arr.length, out = [];
  let cur = arr;
  for (let d = 0; d < n - 1; d++) {
    for (let i = 0; i < n / 2; i++) {
      let a = cur[i], b = cur[n - 1 - i];
      if (a && b) { if (d % 2 === 1 && i === 0) [a, b] = [b, a]; out.push({ id: uid('g'), a, b, sa: null, sb: null, day: d + 1 }); }
    }
    cur = [cur[0], cur[n - 1], ...cur.slice(1, n - 1)];
  }
  return out;
}
function standings(g) {
  const rows = {};
  g.teams.forEach(id => rows[id] = { id, pj: 0, g: 0, e: 0, p: 0, gf: 0, gc: 0, dg: 0, pts: 0 });
  g.matches.forEach(m => {
    if (m.sa == null || m.sb == null) return;
    const A = rows[m.a], B = rows[m.b];
    A.pj++; B.pj++; A.gf += m.sa; A.gc += m.sb; B.gf += m.sb; B.gc += m.sa;
    if (m.sa > m.sb) { A.g++; B.p++; A.pts += 3; }
    else if (m.sa < m.sb) { B.g++; A.p++; B.pts += 3; }
    else { A.e++; B.e++; A.pts++; B.pts++; }
  });
  const arr = Object.values(rows);
  arr.forEach(r => r.dg = r.gf - r.gc);
  arr.sort((x, y) => y.pts - x.pts || y.dg - x.dg || y.gf - x.gf || teamName(x.id).localeCompare(teamName(y.id)));
  return arr;
}

/* ---------- Escalera / Rey de la pista ---------- */
function ladderResolve(t) {
  const n = t.order.length; let king = t.order[0];
  const rows = [];
  for (let i = 1; i < n; i++) {
    const m = t.matches[i - 1], ch = t.order[i], a = king;
    const w = (a && (m.w === a || m.w === ch)) ? m.w : null;
    rows.push({ i, a, b: ch, w, m });
    king = w || null;
  }
  return { rows, champion: king };
}
function sanitizeLadder(t) {
  let c = 0;
  ladderResolve(t).rows.forEach(r => {
    if (!r.a) { if (r.m.w) c++; r.m.w = null; r.m.sa = null; r.m.sb = null; }
    else if (r.m.w && r.m.w !== r.w) { r.m.w = null; r.m.sa = null; r.m.sb = null; c++; }
  });
  return c;
}

/* ---------- Generación ---------- */
function generate() {
  const n = S.teams.length;
  if (n < 2) return toast('Agrega al menos 2 participantes.');
  const ids = shuffle(S.teams.map(t => t.id));
  if (S.format === 'single') {
    S.t = { kind: 'elim', oddRule: S.oddRule, elim: buildElim(ids, S.oddRule) };
  } else if (S.format === 'groups') {
    const cfg = groupCfg();
    if (!cfg.ok) return toast(cfg.msg);
    const groups = [];
    for (let g = 0; g < cfg.G; g++) groups.push({ name: String.fromCharCode(65 + g), teams: [], matches: [] });
    ids.forEach((id, i) => groups[i % cfg.G].teams.push(id));
    groups.forEach(g => g.matches = roundRobin(g.teams));
    S.t = { kind: 'groups', oddRule: S.oddRule, qualifiers: cfg.Q, groups, elim: null };
    ui.tab = 'groups';
  } else {
    S.t = { kind: 'ladder', order: ids, matches: ids.slice(1).map(() => ({ sa: null, sb: null, w: null })) };
  }
  S.phase = 'running'; ui.llSel = [];
  afterChange();
  toast('🎲 ¡Sorteo realizado! Torneo generado.');
  window.scrollTo(0, 0);
}
function genKnockout() {
  const t = S.t;
  const pending = t.groups.reduce((a, g) => a + g.matches.filter(m => m.sa == null || m.sb == null).length, 0);
  if (pending && !confirm(`Quedan ${pending} partido(s) sin marcador. ¿Generar la eliminatoria con las posiciones actuales?`)) return;
  const seeds = [], groupOf = {}, tags = {};
  const st = t.groups.map(g => standings(g));
  t.groups.forEach((g, gi) => g.teams.forEach(id => groupOf[id] = gi));
  for (let r = 0; r < t.qualifiers; r++) t.groups.forEach((g, gi) => {
    if (st[gi][r]) { seeds.push(st[gi][r].id); tags[st[gi][r].id] = (r + 1) + g.name; }
  });
  if (seeds.length < 2) return toast('No hay suficientes clasificados.');
  t.elim = buildElim(seeds, t.oddRule, groupOf, tags);
  ui.tab = 'elim'; ui.llSel = [];
  afterChange();
  toast('Clasificados enviados a la fase eliminatoria.');
}

/* ---------- Cambios de resultado ---------- */
function getCtx(scope, id) {
  const t = S.t;
  if (scope === 'elim') {
    const elim = t.elim, idx = buildIndex(elim), ref = idx[id];
    if (!ref) return null;
    return { scope, m: ref.m, a: srcTeam(ref.m.a, idx), b: srcTeam(ref.m.b, idx),
      guard() {
        if (elim.mode === 'lucky' && ref.ri < elim.rounds.length - 1) {
          if (!confirm('Cambiar este resultado eliminará las rondas posteriores (se volverán a generar). ¿Continuar?')) return false;
          elim.rounds.length = ref.ri + 1; ui.llSel = [];
        }
        return true;
      } };
  }
  if (scope === 'ladder') {
    const L = ladderResolve(t), row = L.rows[Number(id) - 1];
    if (!row) return null;
    return { scope, m: row.m, a: row.a, b: row.b, row, guard: () => true };
  }
  if (scope === 'group') {
    const [gi, mid] = id.split(':');
    const m = t.groups[Number(gi)].matches.find(x => x.id === mid);
    return { scope, m, a: m.a, b: m.b, guard() { if (t.elim) { toast('Los grupos están bloqueados: la eliminatoria ya fue generada.'); return false; } return true; } };
  }
  return null;
}
function ladderAfter(ctx, oldW) {
  if (ctx.scope !== 'ladder' || ctx.m.w === oldW) return;
  let c = 0;
  S.t.matches.forEach((m, k) => { if (k >= Number(ctx.row.i) && (m.w || m.sa != null)) { if (m.w) c++; m.w = null; m.sa = null; m.sb = null; } });
  if (c) toast(`Cambió el rey de la pista: se limpiaron ${c} resultado(s) posteriores.`);
}
function setWinner(scope, id, team) {
  const ctx = getCtx(scope, id);
  if (!ctx || !ctx.a || !ctx.b || ctx.a === BYE || ctx.b === BYE) return;
  if (!ctx.guard()) return render();
  const m = ctx.m, oldW = m.w;
  m.w = (m.w === team) ? null : team;
  if (!m.w) { m.sa = null; m.sb = null; }
  else if (m.sa != null && m.sb != null) {
    const ws = m.w === ctx.a ? m.sa : m.sb, ls = m.w === ctx.a ? m.sb : m.sa;
    if (ws < ls) { m.sa = null; m.sb = null; }
  }
  ladderAfter(ctx, oldW);
  afterChange();
}
function setScore(scope, id, side, raw) {
  const ctx = getCtx(scope, id);
  if (!ctx) return;
  let v = String(raw).trim() === '' ? null : parseInt(raw, 10);
  if (v != null && (isNaN(v) || v < 0)) v = null;
  if (v != null) v = Math.min(v, 999);
  const m = ctx.m;
  if (m['s' + side] === v) return render();
  if (!ctx.guard()) return render();
  const oldW = m.w;
  m['s' + side] = v;
  if (scope !== 'group' && m.sa != null && m.sb != null) {
    if (m.sa > m.sb) m.w = ctx.a;
    else if (m.sb > m.sa) m.w = ctx.b;
    else if (!m.w) toast('Empate: haz clic en el nombre del ganador (ej. por penales).');
  }
  ladderAfter(ctx, oldW);
  afterChange();
}
function afterChange() {
  let cleared = 0;
  if (S.t) {
    if (S.t.elim) cleared += sanitizeElim(S.t.elim);
    if (S.t.kind === 'ladder') cleared += sanitizeLadder(S.t);
    const e = S.t.elim;
    if (e && e.mode === 'lucky') {
      const st = luckyStatus(e);
      if (st.complete && st.survivors.length > 1 && (st.need === 0 || e.rule === 'bye')) e.rounds.push(makeDynamicRound(shuffle(st.survivors), []));
    }
  }
  if (cleared) toast(`Se limpiaron ${cleared} resultado(s) de rondas siguientes afectadas.`);
  save(); render();
}

/* ---------- Compartir (Modo Espectador) ---------- */
function b64uEncode(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64uDecode(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '=';
  const bin = atob(str), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function encodeState(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if ('CompressionStream' in window) {
    try {
      const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      return 'z' + b64uEncode(new Uint8Array(await new Response(stream).arrayBuffer()));
    } catch (e) { }
  }
  return 'j' + b64uEncode(bytes);
}
async function decodeState(code) {
  const kind = code[0], bytes = b64uDecode(code.slice(1));
  if (kind === 'z') {
    if (!('DecompressionStream' in window)) throw new Error('Navegador sin soporte de descompresión');
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return JSON.parse(await new Response(stream).text());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); return true; } catch (e) { }
  try {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
async function share() {
  const payload = JSON.parse(JSON.stringify(S)); payload.sharedAt = Date.now();
  const code = await encodeState(payload);
  const url = location.href.split('#')[0] + '#view=' + code;
  ui.shareUrl = url;
  const copied = await copyText(url);
  const modal = document.getElementById('modal');
  modal.innerHTML = `<div class="modal-box">
    <h3>🔗 Enlace de solo lectura</h3>
    <p class="${copied ? '' : 'muted'}">${copied ? '✅ ¡Enlace copiado al portapapeles! Envíalo por WhatsApp, Telegram, etc.' : 'Copia el enlace manualmente:'}</p>
    <input class="inp" readonly id="shareUrl" value="${esc(url)}">
    <div class="row">
      <button class="btn primary" data-act="copyLink">📋 Copiar</button>
      ${navigator.share ? '<button class="btn" data-act="nativeShare">📤 Compartir…</button>' : ''}
      <a class="btn ghost" href="${esc(url)}" target="_blank" rel="noopener">👁 Probar vista</a>
      <button class="btn ghost" data-act="closeModal">Cerrar</button>
    </div>
    <p class="muted small" style="margin-bottom:0">El enlace guarda una <b>instantánea</b> del torneo en este momento (${url.length.toLocaleString()} caracteres). Cuando haya nuevos resultados, vuelve a pulsar «Compartir Vista» y envía el enlace actualizado.</p>
  </div>`;
  modal.classList.remove('hidden');
  const inp = document.getElementById('shareUrl'); inp.addEventListener('focus', () => inp.select());
}

/* ---------- Render: componentes ---------- */
function renderDuel(o) {
  const ready = o.a && o.b && o.a !== BYE && o.b !== BYE;
  const can = ready && !READONLY && !o.locked;
  const row = (side, id, label, score, tag) => {
    const isW = !!(o.w && id && o.w === id), isL = !!(o.w && id && id !== BYE && o.w !== id);
    const cls = ['team']; if (isW) cls.push('win'); if (isL) cls.push('lose'); if (can) cls.push('clickable');
    const attrs = can ? ` data-act="win" data-scope="${o.scope}" data-id="${esc(o.id)}" data-team="${esc(id)}" title="Clic para marcar a ${esc(teamName(id))} como ganador"` : '';
    const sc = can
      ? `<input class="score" type="text" inputmode="numeric" maxlength="3" autocomplete="off" value="${score ?? ''}" data-chg="score" data-scope="${o.scope}" data-id="${esc(o.id)}" data-side="${side}" data-fk="${o.scope}-${esc(o.id)}-${side}" aria-label="Marcador de ${esc(teamName(id))}">`
      : `<span class="score">${score ?? ''}</span>`;
    return `<div class="${cls.join(' ')}"${attrs}><span class="tname">${isW ? '<span class="ck">✓</span>' : ''}${label}${tag || ''}</span>${sc}</div>`;
  };
  const cls = ['match']; if (o.w) cls.push('done'); if (o.bye) cls.push('byematch');
  return `<div class="${cls.join(' ')}">${o.num ? `<span class="mnum">#${o.num}</span>` : ''}${row('a', o.a, o.la, o.sa, o.ta)}${row('b', o.b, o.lb, o.sb, o.tb)}</div>`;
}
function renderElim(elim) {
  const idx = buildIndex(elim), classic = elim.mode === 'bye';
  const nums = {}; let num = 0;
  elim.rounds.forEach(r => r.matches.forEach(m => { if (m.a.t !== 'bye' && m.b.t !== 'bye') nums[m.id] = ++num; }));
  const champ = elimChampion(elim), tags = elim.tags || {};
  const label = (src, id) => {
    if (src.t === 'bye') return '<i>— BYE (pase directo)</i>';
    if (id && id !== BYE) return esc(teamName(id));
    if (src.t === 'win') return `<i>Ganador #${nums[src.m] || '?'}</i>`;
    return '<i>Por definir</i>';
  };
  let h = `<div class="bracket-scroll" data-scroll="elim"><div class="bracket ${classic ? 'lines' : 'free'}">`;
  elim.rounds.forEach((r, ri) => {
    const entrants = r.matches.length * 2 + (r.byes ? r.byes.length : 0);
    const llSet = new Set(r.ll || []);
    const tagOf = id => (id && id !== BYE ? (tags[id] ? `<span class="tag">${esc(tags[id])}</span>` : '') + (llSet.has(id) ? '<span class="tag ll" title="Mejor perdedor">LL</span>' : '') : '');
    h += `<div class="round ${ri < elim.rounds.length - 1 ? 'has-next' : ''} ${ri > 0 ? 'has-prev' : ''}">
      <div class="round-title"><b>${roundName(entrants, ri)}</b><small>Ronda ${ri + 1} · ${r.matches.filter(m => m.a.t !== 'bye' && m.b.t !== 'bye').length} ${plural(r.matches.length, 'partido')}</small></div><div class="round-body">`;
    r.matches.forEach(m => {
      const a = srcTeam(m.a, idx), b = srcTeam(m.b, idx), bye = m.a.t === 'bye' || m.b.t === 'bye';
      h += `<div class="mw">${renderDuel({ scope: 'elim', id: m.id, a, b, la: label(m.a, a), lb: label(m.b, b), sa: m.sa, sb: m.sb,
        w: bye ? (a === BYE ? b : a) : matchWinner(m, idx), num: nums[m.id], bye, ta: tagOf(a), tb: tagOf(b) })}</div>`;
    });
    h += '</div>';
    if (!classic && ((r.byes && r.byes.length) || (r.ll && r.ll.length))) {
      h += '<div class="round-chips">' +
        (r.byes || []).map(id => `<span class="chip bye">⏭ Pase directo: <b>${esc(teamName(id))}</b></span>`).join('') +
        (r.ll || []).map(id => `<span class="chip ll">♻ Mejor perdedor: <b>${esc(teamName(id))}</b></span>`).join('') + '</div>';
    }
    h += '</div>';
  });

});
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset && el.dataset.chg;
  if (!k || READONLY) return;
  if (k === 'score') { const d = { ...el.dataset }, v = el.value; setTimeout(() => setScore(d.scope, d.id, d.side, v), 0); }
  else if (k === 'groupCount') { S.groupCount = Number(el.value); save(); render(); }
  else if (k === 'qualifiers') { S.qualifiers = Number(el.value); save(); render(); }
  else if (k === 'llSel') {
    const id = el.value, st = luckyStatus(S.t.elim);
    if (el.checked) { if (ui.llSel.length >= st.need) ui.llSel.shift(); ui.llSel.push(id); }
    else ui.llSel = ui.llSel.filter(x => x !== id);
    render();
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.inp === 'name' && !READONLY) { S.name = el.value.slice(0, 60); save(); }
  if (el.classList && el.classList.contains('score')) el.value = el.value.replace(/\D/g, '');
});
document.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key === 'Escape') { if (!document.getElementById('modal').classList.contains('hidden')) ACTIONS.closeModal(); if (ui.editId) ACTIONS.cancelEdit(); return; }
  if (e.key !== 'Enter') return;
  if (el.id === 'oneName') { e.preventDefault(); ACTIONS.addOne(); }
  else if (el.id === 'bulk' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); ACTIONS.addBulk(); }
  else if (el.dataset && el.dataset.edit) { e.preventDefault(); ACTIONS.saveEdit({ dataset: { id: el.dataset.edit } }); }
});
window.addEventListener('hashchange', () => location.reload());

/* ---------- Inicio ---------- */
(async function init() {
  if (location.hash.startsWith('#view=')) {
    READONLY = true;
    try {
      const obj = await decodeState(location.hash.slice(6));
      SNAP_AT = obj.sharedAt || null;
      S = Object.assign(defaultState(), obj);
    } catch (e) {
      S = defaultState(); render();
      document.getElementById('app').innerHTML = '<div class="card empty-state"><div class="e">⚠️</div><h2 style="justify-content:center">Enlace no válido</h2><p>No se pudo leer el torneo compartido. Pide al organizador que lo copie de nuevo.</p></div>';
      return;
    }
  } else {
    S = load();
  }
  render();
})();
</script>
</body>
